<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Session Viewer</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    try {
      var p = localStorage.getItem("as-theme") || "auto";
      var dark = p === "dark" || (p === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.7" y="5.9" width="18.6" height="12.2" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M7.6 18.1v3.3l3.7-3.3z" fill="currentColor" />
        <circle cx="7.7" cy="12" r="1.25" fill="#d97757" />
        <circle cx="10.6" cy="12" r="1.25" fill="#10a37f" />
        <circle cx="13.5" cy="12" r="1.25" fill="#a78bfa" />
        <circle cx="16.4" cy="12" r="1.25" fill="#6b8cff" />
      </svg>
      <span>Agent Session Viewer</span>
    </div>
    <div class="stats" id="stats"></div>
    <span class="scan-time" id="scan-time" title="上次扫描完成时间"></span>
    <div class="theme-switch" id="theme-switch">
      <button data-pref="auto" title="跟随系统">系统</button>
      <button data-pref="light" title="浅色模式">浅色</button>
      <button data-pref="dark" title="深色模式">深色</button>
    </div>
    <button id="refresh" class="btn" title="重新扫描">刷新</button>
  </header>

  <div class="toolbar">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-agent="">全部</button>
      <button class="tab" data-agent="claude">Claude</button>
      <button class="tab" data-agent="codex">Codex</button>
      <button class="tab" data-agent="opencode">OpenCode</button>
      <button class="tab" data-agent="dsh">DSH</button>
    </nav>
    <div class="view-switch" id="view-switch">
      <button data-view="list" class="active" title="会话列表">会话</button>
      <button data-view="dash" title="使用热力图与统计看板">看板</button>
    </div>
    <select id="project-select" class="project-select" title="按项目目录筛选"></select>
    <input id="search" class="search" type="search" placeholder="搜索标题 / 目录 / 内容摘要…" />
    <select id="sort" class="sort">
      <option value="updated">按更新时间</option>
      <option value="created">按创建时间</option>
      <option value="messages">按消息数</option>
      <option value="tokens">按 Token 数</option>
    </select>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">项目目录<span id="proj-count" class="sidebar-count"></span></div>
      <div id="projects" class="projects"></div>
    </aside>
    <main>
      <div id="crumb" class="crumb" hidden></div>

      <section id="dash" class="dash" hidden>
        <div class="panel span-2">
          <div class="panel-head">
            <h3>使用热力图</h3>
            <span class="panel-sub" id="activity-sub"></span>
            <div class="panel-tools">
              <div class="seg" id="hm-metric">
                <button data-m="msgs" class="active">消息</button>
                <button data-m="sessions">会话</button>
                <button data-m="tokens">Token</button>
                <button data-m="cost">花费</button>
              </div>
              <div class="seg" id="hm-range">
                <button data-r="90">90天</button>
                <button data-r="180" class="active">180天</button>
                <button data-r="365">1年</button>
              </div>
            </div>
          </div>
          <div class="panel-body" id="activity-body"></div>
        </div>

        <div class="panel span-2">
          <div class="panel-head">
            <h3>趋势</h3>
            <span class="panel-sub" id="trend-sub"></span>
            <div class="panel-tools">
              <div class="seg" id="trend-metric">
                <button data-m="msgs" class="active">消息</button>
                <button data-m="tokens">Token</button>
                <button data-m="cost">花费</button>
              </div>
            </div>
          </div>
          <div class="panel-body" id="trend-body"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>模型分布</h3>
            <span class="panel-sub" id="models-sub"></span>
          </div>
          <div class="panel-body" id="models-body"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h3>项目排行</h3>
            <span class="panel-sub" id="ranking-sub"></span>
          </div>
          <div class="panel-body" id="ranking-body"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>工具排行</h3>
            <span class="panel-sub" id="tools-sub"></span>
          </div>
          <div class="panel-body" id="tools-body"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h3>Agent 对比</h3>
            <span class="panel-sub" id="agent-sub"></span>
          </div>
          <div class="panel-body" id="agent-body"></div>
        </div>
      </section>

      <div id="list" class="list"></div>
      <div id="empty" class="empty" hidden>没有匹配的会话</div>
    </main>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <div class="modal-titles">
          <div id="detail-title" class="detail-title"></div>
          <div id="detail-meta" class="detail-meta"></div>
          <div id="detail-stats" class="detail-stats"></div>
          <div id="detail-rel" class="detail-rel" hidden></div>
        </div>
        <div class="modal-actions">
          <label class="switch" title="显示模型的思考过程与工具调用">
            <input type="checkbox" id="show-noise" />
            <span>思考 / 工具</span>
          </label>
          <button id="detail-export" class="btn" title="复制整段对话为 Markdown">导出</button>
          <button id="close" class="btn">关闭</button>
        </div>
      </div>
      <div class="modal-body">
        <div id="detail-body" class="messages"></div>
        <aside id="rail" class="rail" hidden>
          <div class="rail-head">消息<span id="rail-count" class="rail-count"></span></div>
          <div id="rail-list" class="rail-list"></div>
        </aside>
      </div>
    </div>
  </div>

  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/md.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
