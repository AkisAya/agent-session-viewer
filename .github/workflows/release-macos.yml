name: Build macOS and Upload Release Asset

on:
  push:
    tags:
      - 'v*'   # 推送 tag（例如 v1.0.0）时触发

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build binary
        run: |
          set -e
          mkdir -p build
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/agent-session .
          # 确认生成的可执行文件存在
          ls -la build

      - name: Archive binary to tar.gz
        run: |
          set -e
          cd build
          tar -czf agent-session-macos-arm64-${{ github.ref_name }}.tar.gz agent-session
          ls -la

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Compiler release for ${{ github.ref_name }}
          draft: false
          prerelease: false
          artifacts: build/agent-session-macos-arm64-${{ github.ref_name }}.tar.gz
