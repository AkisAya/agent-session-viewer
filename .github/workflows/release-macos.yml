name: Build and publish macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build macOS binary
        run: |
          set -e
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o agent-session .

      - name: Package artifact
        run: |
          set -e
          VERSION=${GITHUB_REF##*/}
          mkdir -p release
          if [ ! -f agent-session ]; then
            echo "agent-session binary not found"
            ls -la
            exit 1
          fi
          tar -czf release/${VERSION}-macos-arm64.tar.gz agent-session

      - name: Create Release and upload asset
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          files: release/${{ github.ref_name }}-macos-arm64.tar.gz